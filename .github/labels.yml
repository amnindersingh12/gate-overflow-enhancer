# GitHub Labels
# Apply with: npx github-label-sync --access-token <token> --labels .github/labels.yml YOUR_USERNAME/gate-overflow-enhancer

- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"

- name: "enhancement"
  color: "a2eeef"
  description: "New feature or request"

- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers — well-scoped and documented"

- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed, open for anyone to pick up"

- name: "needs-triage"
  color: "e4e669"
  description: "Needs to be reviewed and categorized"

- name: "question"
  color: "d876e3"
  description: "Further information is requested"

- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"

- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"

- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"

- name: "invalid"
  color: "e4e669"
  description: "This doesn't seem right"

- name: "performance"
  color: "f9d0c4"
  description: "Related to speed or resource usage"

- name: "ui/ux"
  color: "bfdadc"
  description: "Related to visual or interaction design"
